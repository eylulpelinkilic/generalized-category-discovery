# Open-VCLIP native test configuration (configs/Kinetics/TemporalCLIP_vitb16_8x16_STAdapter.yaml
# + script/testing/temporal_test_b16/*.sh): 8 frames x sampling rate 16 at 30 fps target,
# 3 uniformly offset temporal views x 1 centre crop, shorter side 224 (bilinear),
# 28-template prompt ensemble, weight patching ratio 0.5. Views are combined by summing
# logits, which ranks classes like our mean-of-normalised-frames score.
comparison: native
native_for: openvclip
sampling: {method: slowfast_dense, num_frames: 8, sampling_rate: 16, num_views: 3, target_fps: 30, use_offset: true}
spatial: {preset: slowfast_center, size: 224}
prompts: {template_set: openvclip28}
